<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="Жёлтый автобус ПАЗ">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b02d"/>
      <stop offset=".55" stop-color="#d99116"/>
      <stop offset="1" stop-color="#b86e0a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4fb"/>
      <stop offset="1" stop-color="#7698aa"/>
    </linearGradient>
  </defs>

  <!-- transparent canvas: no background -->
  <ellipse cx="124" cy="124" rx="96" ry="8" fill="#1a2230" opacity=".16"/>

  <!-- rounded PAZ body -->
  <path d="M28 42c2-15 15-24 33-26h116c22 0 34 10 36 30l5 54c1 12-8 20-20 20H45c-13 0-21-8-20-20z" fill="url(#body)" stroke="#7c4707" stroke-width="2"/>
  <path d="M33 85h180v26H33z" fill="#c87e0c" opacity=".45"/>

  <!-- roof skylights -->
  <g fill="#9fc0d4" stroke="#293b49" stroke-width="1.4">
    <path d="M48 21h24l7 17H43z"/>
    <path d="M79 20h25l5 18H84z"/>
    <path d="M111 20h25l3 18h-25z"/>
    <path d="M144 20h25v18h-25z"/>
  </g>

  <!-- side windows -->
  <g fill="url(#glass)" stroke="#263746" stroke-width="2">
    <rect x="42" y="45" width="27" height="31" rx="3"/>
    <rect x="73" y="45" width="27" height="31" rx="3"/>
    <rect x="104" y="45" width="27" height="31" rx="3"/>
    <rect x="135" y="45" width="25" height="31" rx="3"/>
    <path d="M165 45h32c7 0 11 4 12 11l2 20h-46z"/>
  </g>

  <!-- folding doors -->
  <g fill="#f3eee3" stroke="#4b5360" stroke-width="1.6">
    <rect x="36" y="79" width="18" height="34" rx="1"/>
    <rect x="55" y="79" width="18" height="34" rx="1"/>
    <rect x="132" y="79" width="17" height="34" rx="1"/>
    <rect x="150" y="79" width="17" height="34" rx="1"/>
  </g>
  <g stroke="#858b92" stroke-width="1">
    <path d="M45 81v30M64 81v30M140.5 81v30M158.5 81v30"/>
  </g>

  <!-- front grille and lights -->
  <rect x="180" y="83" width="24" height="18" rx="2" fill="#6e4b2f" stroke="#372a20" stroke-width="1.5"/>
  <rect x="207" y="83" width="8" height="18" rx="2" fill="#9c6d3e"/>
  <circle cx="182" cy="108" r="5" fill="#f6f0d7" stroke="#4a4a45" stroke-width="1.5"/>
  <circle cx="196" cy="108" r="5" fill="#f4c128" stroke="#5f4a08" stroke-width="1.5"/>
  <circle cx="211" cy="108" r="4" fill="#efeee8" stroke="#4d4e4b" stroke-width="1.5"/>
  <rect x="175" y="114" width="40" height="6" rx="2" fill="#e8e6df" stroke="#777"/>

  <!-- chrome trim -->
  <path d="M31 78h184" stroke="#f2f2ee" stroke-width="3"/>
  <path d="M31 79h184" stroke="#6f7274" stroke-width="1"/>

  <!-- wheels -->
  <g>
    <circle cx="72" cy="116" r="18" fill="#17191d"/>
    <circle cx="72" cy="116" r="9" fill="#bfc4c8"/>
    <circle cx="72" cy="116" r="4" fill="#6e7479"/>
    <circle cx="184" cy="116" r="18" fill="#17191d"/>
    <circle cx="184" cy="116" r="9" fill="#bfc4c8"/>
    <circle cx="184" cy="116" r="4" fill="#6e7479"/>
  </g>

  <!-- mirrors -->
  <path d="M213 56l13-8" stroke="#555" stroke-width="2"/>
  <rect x="224" y="42" width="6" height="10" rx="2" fill="#8b9298" stroke="#444"/>

  <!-- PAZ badge -->
  <path d="M191 73l5 4-5 5-5-5z" fill="#a62820" stroke="#f5d2a1" stroke-width="1"/>
  <text x="191" y="79" text-anchor="middle" font-size="4.5" font-family="Arial,sans-serif" font-weight="700" fill="#fff">ПАЗ</text>
</svg>