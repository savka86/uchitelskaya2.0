name: Add Media Upload Consent

on:
  push:
    paths:
      - '.github/workflows/add-media-consent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add consent to media upload
        shell: python
        run: |
          from pathlib import Path
          p = Path('fuel-radar/index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".mediaHint{padding:9px 10px;border-radius:10px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);font-size:12px;line-height:1.45;color:var(--text);margin-bottom:10px}"
          new_css = old_css + ".mediaConsent{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start;padding:10px 11px;margin:0 0 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:11px;line-height:1.45;color:var(--muted);cursor:pointer}.mediaConsent input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--blue)}.mediaConsent b{color:var(--text)}"
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_dialog = '<div class="mediaHint"><b>Автоудаление через 1 час.</b><br>Фото: JPG, PNG или WebP до 5 МБ. Видео: MP4 или MOV, не длиннее 10 секунд и до 15 МБ.</div><div class="formrow"><label for="mediaFile">Выберите файл</label>'
          consent = '<div class="mediaHint"><b>Автоудаление через 1 час.</b><br>Фото: JPG, PNG или WebP до 5 МБ. Видео: MP4 или MOV, не длиннее 10 секунд и до 15 МБ.</div><label class="mediaConsent" for="mediaConsent"><input id="mediaConsent" type="checkbox" required><span><b>Согласие на публикацию.</b> Я подтверждаю, что являюсь автором материала или имею право его публиковать, не нарушаю права других лиц и разрешаю «Радару АЗС» временно показывать фото/видео пользователям сервиса до автоматического удаления через 1 час. Если человек является главным объектом съёмки, материал можно загружать только с его согласием.</span></label><div class="formrow"><label for="mediaFile">Выберите файл</label>'
          if old_dialog not in s:
              raise SystemExit('Dialog anchor not found')
          s = s.replace(old_dialog, consent, 1)

          old_submit = "el.mediaForm.addEventListener('submit',async e=>{e.preventDefault();const file=el.mediaFile.files?.[0];if(!file){el.mediaMsg.textContent='Выберите фото или видео.';return}"
          new_submit = "el.mediaForm.addEventListener('submit',async e=>{e.preventDefault();const consent=document.getElementById('mediaConsent');if(!consent?.checked){el.mediaMsg.textContent='Перед загрузкой подтвердите согласие на публикацию.';consent?.focus();return}const file=el.mediaFile.files?.[0];if(!file){el.mediaMsg.textContent='Выберите фото или видео.';return}"
          if old_submit not in s:
              raise SystemExit('Submit anchor not found')
          s = s.replace(old_submit, new_submit, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Require consent before photo and video upload"
          git push