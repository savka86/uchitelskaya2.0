name: Fuel camera monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fuel-radar/camera-monitor.py
      - .github/workflows/fuel-camera-monitor.yml
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: fuel-camera-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitor dependencies
        run: python -m pip install "playwright>=1.50,<2" "ultralytics>=8.3,<9"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Inspect public camera frames
        run: python fuel-radar/camera-monitor.py

      - name: Publish camera status
        run: |
          git config user.name "fuel-radar-bot"
          git config user.email "fuel-radar-bot@users.noreply.github.com"
          git add fuel-radar/data/camera-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Обновить анализ камер [skip ci]"
          git push
