name: Enable PWA photo only

on:
  push:
    paths:
      - '.github/workflows/enable-pwa-photo-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only PWA photo hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          old="function openMedia(s){if(!window.RADAR_NATIVE_APP){alert('Загрузка фото и видео доступна в Android-приложении «Радар АЗС», где медиа проходит автоматическую защиту приватности.');return}"
          new="function openMedia(s){if(!window.RADAR_NATIVE_APP&&location.hostname!=='radar-azs.vercel.app'){alert('Загрузка фото и видео доступна в Android-приложении «Радар АЗС», где медиа проходит автоматическую защиту приватности.');return}"
          if old not in s:
              raise SystemExit('openMedia target not found')
          s=s.replace(old,new,1)
          hook='<script src="./pwa-photo-final.js?v=3"></script>'
          if hook not in s:
              s=s.replace('</body>',hook+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuel-radar/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable photo upload on Vercel PWA only'
          git push
