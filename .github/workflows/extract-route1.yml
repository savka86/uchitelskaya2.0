name: Extract Route 1
on:
  push:
    paths:
      - '.github/workflows/extract-route1.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Yandex route 1 page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yandex.ru/maps/101301/namtsy/routes/bus_1/796d617073626d313a2f2f7472616e7369742f6c696e653f69643d34303432323438353838266c6c3d3132392e36373037303925324336322e373131333930266e616d653d3126723d3630303026747970653d627573/?ll=129.680674%2C62.702761&tab=stops&z=11.34'
          curl -A 'Mozilla/5.0' -sS -L "$URL" -o /tmp/route.html
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('/tmp/route.html').read_text(errors='ignore')
          marker='"masstransitLine":'
          i=s.find(marker)
          if i < 0:
              raise SystemExit('masstransitLine not found')
          start=i+len(marker)
          obj,end=json.JSONDecoder().raw_decode(s[start:])
          print('KEYS', list(obj.keys()))
          feats=obj.get('features',[])
          print('THREADS',len(feats))
          for ti,thread in enumerate(feats):
              print(f'=== THREAD {ti} ===')
              print('PROPS', json.dumps(thread.get('properties',{}), ensure_ascii=False)[:2000])
              fs=thread.get('features',[])
              print('ITEMS',len(fs))
              for item in fs:
                  if 'name' in item:
                      c=item.get('coordinates')
                      print('STOP', item.get('id'), item.get('name'), c[1] if c else None, c[0] if c else None)
                  elif 'points' in item:
                      pts=item.get('points',[])
                      print('SEG', json.dumps([[p[1],p[0]] for p in pts], ensure_ascii=False, separators=(',',':')))
          PY
