name: Android Legal Pages PR Patch

on:
  pull_request:
    paths:
      - 'android-radar/PATCH_LEGAL_PAGES.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Patch MainActivity
        shell: python
        run: |
          from pathlib import Path
          p=Path('android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          anchor='''            Uri uri = request.getUrl();
            if ("radar.local".equalsIgnoreCase(uri.getHost())
                    && "/data/camera-status.json".equals(uri.getPath())) {'''
          insert='''            Uri uri = request.getUrl();
            if ("radar.local".equalsIgnoreCase(uri.getHost())
                    && ("/privacy.html".equals(uri.getPath()) || "/rights.html".equals(uri.getPath()))) {
                try {
                    String assetName = "/privacy.html".equals(uri.getPath()) ? "privacy.bin" : "rights.bin";
                    byte[] html = decryptAsset(assetName);
                    return new WebResourceResponse(
                            "text/html",
                            "UTF-8",
                            new ByteArrayInputStream(html)
                    );
                } catch (Exception ignored) {
                    return new WebResourceResponse(
                            "text/html",
                            "UTF-8",
                            500,
                            "Local page error",
                            null,
                            new ByteArrayInputStream("<!doctype html><meta charset='utf-8'><p>Не удалось открыть страницу.</p>".getBytes(StandardCharsets.UTF_8))
                    );
                }
            }
            if ("radar.local".equalsIgnoreCase(uri.getHost())
                    && "/data/camera-status.json".equals(uri.getPath())) {'''
          if anchor not in s:
              if 'privacy.bin' in s and 'rights.bin' in s:
                  raise SystemExit(0)
              raise SystemExit('intercept anchor not found')
          p.write_text(s.replace(anchor,insert,1),encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Serve encrypted legal pages inside Android app"
          git push origin HEAD:${{ github.head_ref }}
