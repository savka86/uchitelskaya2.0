name: Patch Radar Video Privacy

on:
  push:
    paths:
      - '.github/workflows/patch-radar-video-privacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Integrate native privacy processing
        shell: python
        run: |
          from pathlib import Path

          p=Path('android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              '"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 " +\n                "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"',
              '"Mozilla/5.0 (Linux; Android) AppleWebKit/537.36 " +\n                "(KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36 RadarAZS/1.1.4"',
              1
          )

          s=s.replace(
              '"<style>html,body{min-width:1280px}</style></head>"',
              '"<script>window.RADAR_NATIVE_APP=true;window.RADAR_NATIVE_VERSION=\\\"1.1.4\\\";</script><style>html,body{min-width:1280px}</style></head>"',
              1
          )

          old='''        Uri[] result = null;
        if (resultCode == RESULT_OK) {
            if (data != null && (data.getData() != null || data.getClipData() != null)) {
                result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
            } else if (pendingPhotoFile != null && pendingPhotoFile.length() > 0 && pendingPhotoUri != null) {
                result = new Uri[]{pendingPhotoUri};
            } else if (pendingVideoFile != null && pendingVideoFile.length() > 0 && pendingVideoUri != null) {
                result = new Uri[]{pendingVideoUri};
            }
        }

        filePathCallback.onReceiveValue(result);
        filePathCallback = null;
        pendingPhotoUri = null;
        pendingVideoUri = null;
        pendingPhotoFile = null;
        pendingVideoFile = null;
'''
          new='''        Uri sourceUri = null;
        boolean capturedVideo = false;
        if (resultCode == RESULT_OK) {
            if (data != null && (data.getData() != null || data.getClipData() != null)) {
                Uri[] picked = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                if (picked != null && picked.length > 0) sourceUri = picked[0];
            } else if (pendingPhotoFile != null && pendingPhotoFile.length() > 0 && pendingPhotoUri != null) {
                sourceUri = pendingPhotoUri;
            } else if (pendingVideoFile != null && pendingVideoFile.length() > 0 && pendingVideoUri != null) {
                sourceUri = pendingVideoUri;
                capturedVideo = true;
            }
        }

        if (sourceUri == null) {
            finishFileChooser(null);
            return;
        }

        String mime = null;
        try { mime = getContentResolver().getType(sourceUri); } catch (Exception ignored) {}
        boolean isVideo = capturedVideo || (mime != null && mime.toLowerCase(Locale.ROOT).startsWith("video/"));
        final Uri selectedUri = sourceUri;

        if (isVideo) {
            setPrivacyStatus("Автозащита видео: проверяю кадры на лица и госномера…");
            PrivacyVideoProcessor.process(this, selectedUri, new PrivacyVideoProcessor.Callback() {
                @Override
                public void onSuccess(Uri safeUri, double durationSeconds, int framesChecked) {
                    finishFileChooser(new Uri[]{safeUri});
                    if (webView != null) {
                        webView.postDelayed(() -> setPrivacyStatus(
                                "Видео проверено: " + framesChecked + " кадров. Лица и номера не обнаружены. Звук и исходные метаданные удалены."
                        ), 450);
                    }
                }

                @Override
                public void onBlocked(int facesFound, int platesFound) {
                    finishFileChooser(null);
                    setPrivacyStatus(
                            "Видео не принято: обнаружены лица или госномера (лица — " + facesFound +
                                    ", номера — " + platesFound + "). Снимите ролик без людей и читаемых номеров."
                    );
                }

                @Override
                public void onFailure(String message) {
                    finishFileChooser(null);
                    setPrivacyStatus("Видео не выбрано: " + message);
                }
            });
        } else {
            setPrivacyStatus("Автозащита фото: скрываю найденные лица и госномера…");
            PrivacyImageProcessor.process(this, selectedUri, new PrivacyImageProcessor.Callback() {
                @Override
                public void onSuccess(Uri safeUri, int facesHidden, int platesHidden) {
                    finishFileChooser(new Uri[]{safeUri});
                    if (webView != null) {
                        webView.postDelayed(() -> setPrivacyStatus(
                                "Фото защищено: скрыто лиц — " + facesHidden +
                                        ", номеров — " + platesHidden + ". Метаданные удалены."
                        ), 450);
                    }
                }

                @Override
                public void onFailure() {
                    finishFileChooser(null);
                    setPrivacyStatus("Фото не выбрано: не удалось безопасно обработать изображение.");
                }
            });
        }
'''
          if old not in s:
              raise SystemExit('MainActivity result block not found')
          s=s.replace(old,new,1)

          anchor='''    @Override
    @SuppressWarnings("deprecation")
    public void onBackPressed() {'''
          methods='''    private void finishFileChooser(Uri[] result) {
        if (filePathCallback != null) {
            filePathCallback.onReceiveValue(result);
            filePathCallback = null;
        }
        pendingPhotoUri = null;
        pendingVideoUri = null;
        pendingPhotoFile = null;
        pendingVideoFile = null;
    }

    private void setPrivacyStatus(String message) {
        if (webView == null) return;
        String safe = message.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'").replace("\n", " ");
        webView.evaluateJavascript(
                "(function(){var n=document.getElementById('mediaMsg');if(n)n.textContent='" + safe + "';})()",
                null
        );
    }

'''+anchor
          if anchor not in s:
              raise SystemExit('MainActivity method anchor not found')
          s=s.replace(anchor,methods,1)
          p.write_text(s,encoding='utf-8')

          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              "MEDIA_UPLOAD=SUPABASE_URL+'/functions/v1/station-media-upload'",
              "MEDIA_UPLOAD=SUPABASE_URL+'/functions/v1/station-media-upload-safe'",
              1
          )
          s=s.replace(
              'В карточке АЗС можно показать обстановку. Видео — до 10 секунд, файл автоматически удалится через час.',
              'В приложении можно добавить фото или видео обстановки. Фото автоматически скрывает найденные лица и номера. Видео до 10 секунд проходит покадровую проверку; ролик с обнаруженными лицами или номерами не публикуется. Звук из опубликованного видео удаляется. Файл удалится через час.',
              1
          )
          s=s.replace(
              '<b>Автоудаление через 1 час.</b><br>Фото: JPG, PNG или WebP до 5 МБ. Видео: MP4 или MOV, не длиннее 10 секунд и до 15 МБ.',
              '<b>Автозащита + удаление через 1 час.</b><br>Фото: приложение скрывает найденные лица и госномера. Видео: до 10 секунд, приложение проверяет кадры; если найдено лицо или номер — ролик не публикуется. У безопасной видеокопии удаляется звук. Фото до 5 МБ, видео до 15 МБ.',
              1
          )
          old_open="function openMedia(s){state.selectedId=s.id;"
          new_open="function openMedia(s){if(!window.RADAR_NATIVE_APP){alert('Загрузка фото и видео доступна в Android-приложении «Радар АЗС», где медиа проходит автоматическую защиту приватности.');return}state.selectedId=s.id;"
          if old_open in s:
              s=s.replace(old_open,new_open,1)
          elif 'Загрузка фото и видео доступна в Android-приложении' not in s:
              raise SystemExit('openMedia anchor not found')

          old_submit="body.append('station_id',el.mediaStationId.value);body.append('file',file,file.name);const r=await fetch(MEDIA_UPLOAD"
          new_submit="body.append('station_id',el.mediaStationId.value);body.append('consent_accepted','yes');body.append('consent_version','media-v1-2026-08-23');body.append('privacy_processed','yes');body.append('privacy_method',String(file.type||'').toLowerCase().startsWith('video/')?'android-mlkit-video-screen-transcode-v1':'android-mlkit-face-ocr-mosaic-v1');body.append('file',file,file.name);const r=await fetch(MEDIA_UPLOAD"
          if old_submit in s:
              s=s.replace(old_submit,new_submit,1)
          elif "body.append('privacy_processed','yes')" not in s:
              raise SystemExit('media submit anchor not found')
          p.write_text(s,encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java fuel-radar/index.html
          git commit -m "Integrate protected photo and video uploads"
          git push
