name: Add Fuel Radar Theme Switch

on:
  push:
    paths:
      - '.github/workflows/add-fuel-radar-theme-switch.yml'

permissions:
  contents: write

jobs:
  update-theme-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add theme selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fuel-radar/index.html')
          text = path.read_text(encoding='utf-8')

          title = '<title>Радар АЗС — Якутск</title>'
          head_script = '''<title>Радар АЗС — Якутск</title>\n<script>try{const t=localStorage.getItem('fuelRadarTheme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>'''
          if 'fuelRadarTheme' not in text:
              if title not in text:
                  raise SystemExit('Page title marker not found')
              text = text.replace(title, head_script, 1)

          theme_css = ''':root[data-theme="light"]{color-scheme:light;--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d7dce3;--blue:#2563eb}:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1117;--card:#151b24;--text:#f3f4f6;--muted:#9ca3af;--border:#303846}\n'''
          root_marker = ':root{color-scheme:light dark;--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d7dce3;--blue:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#0c1117;--card:#151b24;--text:#f3f4f6;--muted:#9ca3af;--border:#303846}}\n'
          if ':root[data-theme="light"]' not in text:
              if root_marker not in text:
                  raise SystemExit('Theme root CSS marker not found')
              text = text.replace(root_marker, root_marker + theme_css, 1)

          head_css_old = '.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}h1{font-size:25px;margin:0 0 3px}'
          head_css_new = '.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.headActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.themeSelect{min-height:34px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:0 11px;font-size:12px;font-weight:800;cursor:pointer}h1{font-size:25px;margin:0 0 3px}'
          if '.themeSelect{' not in text:
              if head_css_old not in text:
                  raise SystemExit('Header CSS marker not found')
              text = text.replace(head_css_old, head_css_new, 1)

          old_header = '<div class="head"><div><h1>⛽ Радар АЗС — помоги другим водителям Якутска узнать реальную обстановку на заправках.</h1><div class="sub">Присоединяйся к водителям Якутска: делись свежей информацией об очередях и наличии топлива — вместе поможем друг другу экономить время.</div></div><div id="count" class="badge">загрузка…</div></div>'
          new_header = '''<div class="head"><div><h1>⛽ Радар АЗС — помоги другим водителям Якутска узнать реальную обстановку на заправках.</h1><div class="sub">Присоединяйся к водителям Якутска: делись свежей информацией об очередях и наличии топлива — вместе поможем друг другу экономить время.</div></div><div class="headActions"><select id="themeSelect" class="themeSelect" aria-label="Выбор темы"><option value="light">☀️ Светлая</option><option value="dark">🌙 Тёмная</option></select><div id="count" class="badge">загрузка…</div></div></div>\n<script>(function(){const s=document.getElementById('themeSelect');let t;try{t=localStorage.getItem('fuelRadarTheme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;s.value=t;s.addEventListener('change',function(){document.documentElement.dataset.theme=this.value;try{localStorage.setItem('fuelRadarTheme',this.value)}catch(e){}})})();</script>'''
          if 'id="themeSelect"' not in text:
              if old_header not in text:
                  raise SystemExit('Header HTML marker not found')
              text = text.replace(old_header, new_header, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Add light and dark theme selector"
          git push origin main
