name: Patch Radar Media UI 1.1.4

on:
  push:
    paths:
      - '.github/workflows/patch-radar-media-ui-114.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch media UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              "MEDIA_UPLOAD=SUPABASE_URL+'/functions/v1/station-media-upload'",
              "MEDIA_UPLOAD=SUPABASE_URL+'/functions/v1/station-media-upload-safe'",
              1
          )
          s=s.replace(
              'В карточке АЗС можно показать обстановку. Видео — до 10 секунд, файл автоматически удалится через час.',
              'В приложении можно добавить фото или видео обстановки. Фото автоматически скрывает найденные лица и номера. Видео до 10 секунд проходит покадровую проверку; ролик с обнаруженными лицами или номерами не публикуется. Звук из опубликованного видео удаляется. Файл удалится через час.',
              1
          )
          s=s.replace(
              '<b>Автоудаление через 1 час.</b><br>Фото: JPG, PNG или WebP до 5 МБ. Видео: MP4 или MOV, не длиннее 10 секунд и до 15 МБ.',
              '<b>Автозащита + удаление через 1 час.</b><br>Фото: приложение скрывает найденные лица и госномера. Видео: до 10 секунд, приложение проверяет кадры; если найдено лицо или номер — ролик не публикуется. У безопасной видеокопии удаляется звук. Фото до 5 МБ, видео до 15 МБ.',
              1
          )

          old="function openMedia(s){state.selectedId=s.id;"
          new="function openMedia(s){if(!window.RADAR_NATIVE_APP){alert('Загрузка фото и видео доступна в Android-приложении «Радар АЗС», где медиа проходит автоматическую защиту приватности.');return}state.selectedId=s.id;"
          if old in s:
              s=s.replace(old,new,1)
          elif 'Загрузка фото и видео доступна в Android-приложении' not in s:
              raise SystemExit('openMedia anchor not found')

          old="body.append('consent_version','media-v1-2026-08-23');body.append('file',file,file.name);"
          new="body.append('consent_version','media-v1-2026-08-23');body.append('privacy_processed','yes');body.append('privacy_method',String(file.type||'').toLowerCase().startsWith('video/')?'android-mlkit-video-screen-transcode-v1':'android-mlkit-face-ocr-mosaic-v1');body.append('file',file,file.name);"
          if old in s:
              s=s.replace(old,new,1)
          elif "body.append('privacy_processed','yes')" not in s:
              raise SystemExit('privacy form anchor not found')

          p.write_text(s,encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Enable protected photo and video UI"
          git push
