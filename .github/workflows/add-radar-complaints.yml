name: Add Radar Complaint Controls

on:
  push:
    paths:
      - '.github/workflows/add-radar-complaints.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add complaint controls and feedback consent
        shell: python
        run: |
          from pathlib import Path
          p = Path('fuel-radar/index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Explicit consent for optional contact details in feedback.
          anchor = '<div class="honeypot" aria-hidden="true"><label for="feedbackWebsite">Ваш сайт</label>'
          consent = '<label class="mediaConsent" for="feedbackConsent"><input id="feedbackConsent" type="checkbox" required><span><b>Согласие на обработку контактных данных.</b> Если я указываю телефон, e-mail или Telegram, я согласен на их обработку только для ответа на моё обращение.</span></label>' + anchor
          if anchor not in s:
              raise SystemExit('Feedback consent anchor not found')
          s = s.replace(anchor, consent, 1)

          # 2) Add a complaint button to each station card.
          old_buttons = '<button class="mediaBtn media-btn" type="button">📸 Добавить фото/видео</button></div>'
          new_buttons = '<button class="mediaBtn media-btn" type="button">📸 Добавить фото/видео</button><button class="complaintBtn complaint-btn" type="button">⚠️ Пожаловаться</button></div>'
          if old_buttons not in s:
              raise SystemExit('Card buttons anchor not found')
          s = s.replace(old_buttons, new_buttons, 1)

          old_event = "c.querySelector('.media-btn').addEventListener('click',()=>openMedia(s));if(cam)"
          new_event = "c.querySelector('.media-btn').addEventListener('click',()=>openMedia(s));c.querySelector('.complaint-btn').addEventListener('click',()=>openComplaint(s));if(cam)"
          if old_event not in s:
              raise SystemExit('Complaint event anchor not found')
          s = s.replace(old_event, new_event, 1)

          # 3) Red visual treatment for complaint button.
          css_anchor = '.actions .cameraBtn{border-color:#2563eb;color:#2563eb}'
          css_new = css_anchor + '.actions .complaintBtn{border-color:#dc2626;color:#dc2626}'
          if css_anchor not in s:
              raise SystemExit('Complaint CSS anchor not found')
          s = s.replace(css_anchor, css_new, 1)

          # 4) Complaint opens existing feedback channel with station context prefilled.
          report_anchor = 'function openReport(s){state.selectedId=s.id;'
          complaint_fn = "function openComplaint(s){el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Пожаловаться';document.getElementById('feedbackType').value='problem';const m=document.getElementById('feedbackMessage');m.value='Жалоба по АЗС: '+s.name+'\\nАдрес: '+s.address+'\\nID: '+s.id+'\\nЧто неверно или нарушает права (статус, фото/видео): ';el.feedbackMsg.textContent='';el.sendFeedback.disabled=false;el.sendFeedback.textContent='Отправить жалобу';el.feedbackDialog.showModal();setTimeout(()=>{m.focus();m.setSelectionRange(m.value.length,m.value.length)},0)}\n" + report_anchor
          if report_anchor not in s:
              raise SystemExit('openReport anchor not found')
          s = s.replace(report_anchor, complaint_fn, 1)

          # 5) Restore normal feedback dialog title when opened from the toolbar.
          old_feedback_open = "document.getElementById('feedbackBtn').addEventListener('click',()=>{el.feedbackForm.reset();el.feedbackMsg.textContent='';el.sendFeedback.disabled=false;el.sendFeedback.textContent='Отправить';el.feedbackDialog.showModal()});"
          new_feedback_open = "document.getElementById('feedbackBtn').addEventListener('click',()=>{el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Отзывы и предложения';el.feedbackMsg.textContent='';el.sendFeedback.disabled=false;el.sendFeedback.textContent='Отправить';el.feedbackDialog.showModal()});"
          if old_feedback_open not in s:
              raise SystemExit('Feedback open anchor not found')
          s = s.replace(old_feedback_open, new_feedback_open, 1)

          # 6) Defensive JS check in addition to native required validation.
          submit_anchor = "el.feedbackForm.addEventListener('submit',async e=>{e.preventDefault();el.feedbackMsg.textContent='Отправляю…';"
          submit_new = "el.feedbackForm.addEventListener('submit',async e=>{e.preventDefault();const consent=document.getElementById('feedbackConsent');if(!consent?.checked){el.feedbackMsg.textContent='Подтвердите согласие на обработку указанных контактных данных.';consent?.focus();return}el.feedbackMsg.textContent='Отправляю…';"
          if submit_anchor not in s:
              raise SystemExit('Feedback submit anchor not found')
          s = s.replace(submit_anchor, submit_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Add complaint flow and feedback consent"
          git push
