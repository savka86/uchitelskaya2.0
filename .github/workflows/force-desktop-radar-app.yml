name: Force Desktop Radar App

on:
  push:
    paths:
      - '.github/workflows/force-desktop-radar-app.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Apply desktop-mode Android changes
        shell: python
        run: |
          from pathlib import Path

          main = Path('android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          old = '''        settings.setLoadWithOverviewMode(true);\n        settings.setUseWideViewPort(true);\n'''
          new = '''        settings.setLoadWithOverviewMode(true);\n        settings.setUseWideViewPort(true);\n        settings.setTextZoom(100);\n        settings.setUserAgentString(\n                "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 " +\n                "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"\n        );\n'''
          if old not in s:
              raise SystemExit('WebSettings anchor not found')
          s = s.replace(old, new, 1)

          old = '''            String html = new String(htmlBytes, StandardCharsets.UTF_8);\n            webView.loadDataWithBaseURL(LOCAL_ORIGIN, html, "text/html", "UTF-8", null);\n'''
          new = '''            String html = new String(htmlBytes, StandardCharsets.UTF_8);\n            html = html.replace(\n                    "<meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">",\n                    "<meta name=\\\"viewport\\\" content=\\\"width=1280,user-scalable=yes\\\">"\n            );\n            html = html.replace(\n                    "</head>",\n                    "<style>html,body{min-width:1280px}</style></head>"\n            );\n            webView.loadDataWithBaseURL(LOCAL_ORIGIN, html, "text/html", "UTF-8", null);\n'''
          if old not in s:
              raise SystemExit('HTML load anchor not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')

          manifest = Path('android-radar/app/src/main/AndroidManifest.xml')
          s = manifest.read_text(encoding='utf-8')
          old = '''            android:configChanges="keyboardHidden|orientation|screenSize"\n            android:exported="true">'''
          new = '''            android:configChanges="keyboardHidden|orientation|screenSize"\n            android:screenOrientation="landscape"\n            android:exported="true">'''
          if old not in s:
              raise SystemExit('Manifest activity anchor not found')
          manifest.write_text(s.replace(old, new, 1), encoding='utf-8')

          gradle = Path('android-radar/app/build.gradle')
          s = gradle.read_text(encoding='utf-8')
          s = s.replace('versionCode 1', 'versionCode 2', 1)
          s = s.replace('versionName "1.0.0"', 'versionName "1.1.0"', 1)
          gradle.write_text(s, encoding='utf-8')

          workflow = Path('.github/workflows/build-radar-apk.yml')
          s = workflow.read_text(encoding='utf-8')
          s = s.replace('Radar-AZS-1.0.0.apk', 'Radar-AZS-PC-1.1.0.apk')
          s = s.replace('Radar-AZS-1.0.0.sha256', 'Radar-AZS-PC-1.1.0.sha256')
          workflow.write_text(s, encoding='utf-8')
      - name: Commit desktop-mode app
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add android-radar .github/workflows/build-radar-apk.yml
          git commit -m "Make Radar Android app use desktop layout"
          git push origin main
