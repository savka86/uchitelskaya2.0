name: Patch Radar PWA

on:
  push:
    paths:
      - '.github/workflows/patch-radar-pwa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enable PWA shell and update check
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          if 'rel="manifest" href="./manifest.webmanifest"' not in s:
              s=s.replace('<title>Радар АЗС — Якутск</title>', '<title>Радар АЗС — Якутск</title>\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#111827">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="Радар АЗС">\n<link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">', 1)
          marker='</body>'
          block=r'''<script id="radarPwaBootstrap">
(function(){
  if(!window.RADAR_NATIVE_APP && 'serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));
  }
  let deferredInstall=null;
  window.addEventListener('beforeinstallprompt',e=>{
    if(window.RADAR_NATIVE_APP)return;
    e.preventDefault(); deferredInstall=e;
    const host=document.querySelector('.headActions')||document.querySelector('.head');
    if(!host||document.getElementById('installRadarPwa'))return;
    const b=document.createElement('button');
    b.id='installRadarPwa'; b.className='themeSelect'; b.type='button'; b.textContent='📲 Установить Радар';
    b.addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(_e){}deferredInstall=null;b.remove()});
    host.appendChild(b);
  });
  window.addEventListener('appinstalled',()=>{document.getElementById('installRadarPwa')?.remove()});
  if(window.RADAR_NATIVE_APP && window.RADAR_NATIVE_VERSION){
    fetch('./version.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
      const a=v&&v.android;if(!a||!a.apk_url||a.version_name===window.RADAR_NATIVE_VERSION)return;
      const host=document.querySelector('.headActions')||document.querySelector('.head');if(!host||document.getElementById('radarApkUpdate'))return;
      const link=document.createElement('a');link.id='radarApkUpdate';link.className='badge';link.href=a.apk_url;link.target='_blank';link.rel='noopener';link.textContent='⬆️ Обновление '+a.version_name;link.style.textDecoration='none';host.appendChild(link);
    }).catch(()=>{});
  }
})();
</script>
'''
          if 'id="radarPwaBootstrap"' not in s:
              s=s.replace(marker, block+marker, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Enable Radar AZS PWA install and update checks"
          git push
