name: Patch Radar PWA

on:
  push:
    paths:
      - '.github/workflows/patch-radar-pwa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add PWA links and service worker registration
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          if 'manifest.webmanifest' not in s:
              s=s.replace('<title>Радар АЗС — Якутск</title>', '<title>Радар АЗС — Якутск</title>\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#111827">\n<link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">', 1)
          reg="""<script>
if('serviceWorker' in navigator && !window.RADAR_NATIVE_APP){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
"""
          if "navigator.serviceWorker.register('./service-worker.js')" not in s:
              s=s.replace('</body>', reg+'</body>', 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit PWA integration
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Enable Radar AZS PWA" || exit 0
          git push
# trigger 2
