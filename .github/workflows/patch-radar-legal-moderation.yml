name: Patch Radar Legal Moderation

on:
  push:
    paths:
      - '.github/workflows/patch-radar-legal-moderation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch Radar frontend
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')

          # Footer styles.
          style='''.legalFooter{margin-top:16px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:11px;line-height:1.55;color:var(--muted)}.legalFooter b{color:var(--text)}.legalFooterLinks{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.legalFooter a{color:var(--blue);font-weight:800;text-decoration:none}'''
          if style not in s:
              s=s.replace('</style>',style+'\n</style>',1)

          # Add complaint context to client state.
          old='mediaPreviewUrl:null,mediaValidFile:null};'
          new='mediaPreviewUrl:null,mediaValidFile:null,complaintStationId:null};'
          if old in s:
              s=s.replace(old,new,1)
          elif 'complaintStationId:null' not in s:
              raise SystemExit('state anchor not found')

          # Contact consent only when a contact is actually provided.
          s=s.replace('<input id="feedbackConsent" type="checkbox" required>','<input id="feedbackConsent" type="checkbox">',1)
          s=s.replace('Расскажите, что добавить или исправить в «Радаре бензина».','Расскажите, что добавить или исправить в «Радаре АЗС».',1)

          # Remember station context for complaints.
          old="function openComplaint(s){el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Пожаловаться';"
          new="function openComplaint(s){state.complaintStationId=s.id;el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Пожаловаться';"
          if old in s:
              s=s.replace(old,new,1)
          elif 'function openComplaint(s){state.complaintStationId=s.id;' not in s:
              raise SystemExit('openComplaint anchor not found')

          # Normal feedback must clear complaint context.
          old="document.getElementById('feedbackBtn').addEventListener('click',()=>{el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Отзывы и предложения';"
          new="document.getElementById('feedbackBtn').addEventListener('click',()=>{state.complaintStationId=null;el.feedbackForm.reset();document.querySelector('#feedbackDialog h2').textContent='Отзывы и предложения';"
          if old in s:
              s=s.replace(old,new,1)
          elif "state.complaintStationId=null;el.feedbackForm.reset()" not in s:
              raise SystemExit('feedback open anchor not found')

          # Consent JS check only if a contact was entered.
          old="el.feedbackForm.addEventListener('submit',async e=>{e.preventDefault();const consent=document.getElementById('feedbackConsent');if(!consent?.checked){el.feedbackMsg.textContent='Подтвердите согласие на обработку указанных контактных данных.';consent?.focus();return}el.feedbackMsg.textContent='Отправляю…';"
          new="el.feedbackForm.addEventListener('submit',async e=>{e.preventDefault();const consent=document.getElementById('feedbackConsent'),contactValue=document.getElementById('feedbackContact').value.trim();if(contactValue&&!consent?.checked){el.feedbackMsg.textContent='Если указываете контакт, подтвердите согласие на его обработку.';consent?.focus();return}el.feedbackMsg.textContent='Отправляю…';"
          if old in s:
              s=s.replace(old,new,1)
          elif 'contactValue=document.getElementById' not in s:
              raise SystemExit('feedback submit anchor not found')

          # Send auditable consent version and complaint station context.
          old="const body={feedback_type:document.getElementById('feedbackType').value,message:document.getElementById('feedbackMessage').value.trim(),contact:document.getElementById('feedbackContact').value.trim()||null,page_url:location.href.slice(0,500),website:document.getElementById('feedbackWebsite').value};"
          new="const body={feedback_type:document.getElementById('feedbackType').value,message:document.getElementById('feedbackMessage').value.trim(),contact:contactValue||null,contact_consent:!!consent?.checked,contact_consent_version:consent?.checked?'contact-v1-2026-08-23':null,related_station_id:state.complaintStationId||null,complaint_kind:state.complaintStationId?'station':'general',page_url:location.href.slice(0,500),website:document.getElementById('feedbackWebsite').value};"
          if old in s:
              s=s.replace(old,new,1)
          elif 'contact_consent_version' not in s:
              raise SystemExit('feedback body anchor not found')

          # Public legal footer and independence disclaimer.
          footer='''<footer class="legalFooter"><b>«Радар АЗС» — независимый информационный сервис.</b> Пользовательские статусы, фото и видео не являются официальными заявлениями владельцев АЗС и могут быть скрыты на время проверки после обоснованной жалобы. Сервис не заявляет о партнёрстве с указанными сетями АЗС, картографическими сервисами или владельцами видеокамер, если это прямо не указано.<div class="legalFooterLinks"><a href="./privacy.html">Политика обработки данных</a><a href="./rights.html">Правообладателям и владельцам АЗС</a><a href="mailto:savelii_86@mail.ru">Связаться с владельцем сервиса</a></div></footer>'''
          anchor='</main>\n<dialog id="reportDialog">'
          if footer not in s:
              if anchor not in s: raise SystemExit('footer anchor not found')
              s=s.replace(anchor,footer+'\n</main>\n<dialog id="reportDialog">',1)

          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Add legal footer and auditable complaint consent"
          git push
