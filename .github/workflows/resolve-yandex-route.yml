name: Resolve Yandex Route

on:
  push:
    paths:
      - '.github/workflows/resolve-yandex-route.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve short Yandex Maps URL
        shell: bash
        run: |
          set -euo pipefail
          echo 'SHORT_URL=https://yandex.ru/maps/-/CTHdiQ9w'
          FINAL=$(curl -A 'Mozilla/5.0' -sS -L -o /tmp/yandex.html -w '%{url_effective}' 'https://yandex.ru/maps/-/CTHdiQ9w')
          echo "FINAL_URL=$FINAL"
          echo '--- ROUTE-LIKE TOKENS ---'
          grep -Eo 'rtext=[^"& ]+|rtt=[^"& ]+|mode=[^"& ]+|routes?[^" ]{0,300}' /tmp/yandex.html | head -n 40 || true
