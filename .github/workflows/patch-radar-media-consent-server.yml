name: Patch Radar Media Consent Server

on:
  push:
    paths:
      - '.github/workflows/patch-radar-media-consent-server.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add consent fields to media upload
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          old="body.append('station_id',el.mediaStationId.value);body.append('file',file,file.name);const r=await fetch(MEDIA_UPLOAD,"
          new="body.append('station_id',el.mediaStationId.value);body.append('consent_accepted','yes');body.append('consent_version','media-v1-2026-08-23');body.append('file',file,file.name);const r=await fetch(MEDIA_UPLOAD,"
          if old not in s:
              if "body.append('consent_version','media-v1-2026-08-23')" in s:
                  raise SystemExit(0)
              raise SystemExit('media upload anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add fuel-radar/index.html
          git commit -m "Require auditable media consent on server upload"
          git push
