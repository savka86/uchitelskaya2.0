name: Patch Radar Photo Privacy

on:
  push:
    paths:
      - '.github/workflows/patch-radar-photo-privacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch Android and frontend
        shell: python
        run: |
          from pathlib import Path

          # Android: mark embedded UI as native and force photo-only chooser.
          p=Path('android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"<style>html,body{min-width:1280px}</style></head>"','"<script>window.RADAR_NATIVE_APP=true;</script><style>html,body{min-width:1280px}</style></head>"',1)
          old='''            if (acceptsAny) {
                acceptsImage = true;
                acceptsVideo = true;
            }
'''
          new='''            if (acceptsAny) {
                acceptsImage = true;
                acceptsVideo = true;
            }

            // Privacy mode: only still photos are accepted. Video is temporarily disabled.
            acceptsImage = true;
            acceptsVideo = false;
            acceptsAny = false;
'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'Privacy mode: only still photos are accepted' not in s:
              raise SystemExit('chooser anchor not found')
          s=s.replace('Intent chooser = Intent.createChooser(picker, "Выберите фото или видео");','Intent chooser = Intent.createChooser(picker, "Выберите фото");',1)

          old='''        Uri[] result = null;
        if (resultCode == RESULT_OK) {
            if (data != null && (data.getData() != null || data.getClipData() != null)) {
                result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
            } else if (pendingPhotoFile != null && pendingPhotoFile.length() > 0 && pendingPhotoUri != null) {
                result = new Uri[]{pendingPhotoUri};
            } else if (pendingVideoFile != null && pendingVideoFile.length() > 0 && pendingVideoUri != null) {
                result = new Uri[]{pendingVideoUri};
            }
        }

        filePathCallback.onReceiveValue(result);
        filePathCallback = null;
        pendingPhotoUri = null;
        pendingVideoUri = null;
        pendingPhotoFile = null;
        pendingVideoFile = null;
'''
          new='''        Uri sourceUri = null;
        if (resultCode == RESULT_OK) {
            if (data != null && (data.getData() != null || data.getClipData() != null)) {
                Uri[] picked = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                if (picked != null && picked.length > 0) sourceUri = picked[0];
            } else if (pendingPhotoFile != null && pendingPhotoFile.length() > 0 && pendingPhotoUri != null) {
                sourceUri = pendingPhotoUri;
            }
        }

        if (sourceUri == null) {
            finishFileChooser(null);
            return;
        }

        setPrivacyStatus("Автозащита: ищу лица и госномера…");
        final Uri selectedUri = sourceUri;
        PrivacyImageProcessor.process(this, selectedUri, new PrivacyImageProcessor.Callback() {
            @Override
            public void onSuccess(Uri safeUri, int facesHidden, int platesHidden) {
                finishFileChooser(new Uri[]{safeUri});
                if (webView != null) {
                    webView.postDelayed(() -> setPrivacyStatus(
                            "Автозащита готова: скрыто лиц — " + facesHidden +
                                    ", номеров — " + platesHidden + ". Метаданные фото удалены."
                    ), 450);
                }
            }

            @Override
            public void onFailure() {
                finishFileChooser(null);
                setPrivacyStatus("Фото не выбрано: не удалось безопасно обработать изображение. Попробуйте другое фото.");
            }
        });
'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'PrivacyImageProcessor.process' not in s:
              raise SystemExit('activity result anchor not found')

          anchor='''    @Override
    @SuppressWarnings("deprecation")
    public void onBackPressed() {'''
          methods='''    private void finishFileChooser(Uri[] result) {
        if (filePathCallback != null) {
            filePathCallback.onReceiveValue(result);
            filePathCallback = null;
        }
        pendingPhotoUri = null;
        pendingVideoUri = null;
        pendingPhotoFile = null;
        pendingVideoFile = null;
    }

    private void setPrivacyStatus(String message) {
        if (webView == null) return;
        String safe = message.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'").replace("\n", " ");
        webView.evaluateJavascript(
                "(function(){var n=document.getElementById('mediaMsg');if(n)n.textContent='" + safe + "';})()",
                null
        );
    }

'''+anchor
          if 'private void finishFileChooser' not in s:
              if anchor not in s: raise SystemExit('method anchor not found')
              s=s.replace(anchor,methods,1)
          p.write_text(s,encoding='utf-8')

          # Frontend: website cannot upload media; app accepts only privacy-processed photos.
          p=Path('fuel-radar/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<b>Добавь фото или видео</b>':'<b>Добавь фото</b>',
            'В карточке АЗС можно показать обстановку. Видео — до 10 секунд, файл автоматически удалится через час.':'В приложении можно добавить фото обстановки. Перед загрузкой приложение автоматически скрывает найденные лица и госномера; фото удаляется через час.',
            '📸 Добавить фото/видео':'📸 Добавить фото',
            '<h2 id="mediaDialogTitle">Добавить фото или видео</h2>':'<h2 id="mediaDialogTitle">Добавить фото</h2>',
            '<p>Файл появится в карточке выбранной АЗС.</p>':'<p>В карточке появится только обработанная копия фото.</p>',
            '<b>Автоудаление через 1 час.</b><br>Фото: JPG, PNG или WebP до 5 МБ. Видео: MP4 или MOV, не длиннее 10 секунд и до 15 МБ.':'<b>Автозащита + удаление через 1 час.</b><br>Приложение перед отправкой ищет лица и госномера, скрывает найденные области и удаляет метаданные исходного фото. JPG, PNG или WebP до 5 МБ. Видео временно отключено.',
            'временно показывать фото/видео пользователям сервиса':'временно показывать обработанную копию фото пользователям сервиса',
            'accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime"':'accept="image/jpeg,image/png,image/webp"',
            "el.mediaDialogTitle.textContent='Фото/видео: '+s.name;":"el.mediaDialogTitle.textContent='Фото: '+s.name;",
            "if(!file){el.mediaMsg.textContent='Выберите фото или видео.';return}":"if(!file){el.mediaMsg.textContent='Выберите фото.';return}",
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          old="function openMedia(s){state.selectedId=s.id;"
          new="function openMedia(s){if(!window.RADAR_NATIVE_APP){alert('Загрузка фото доступна в приложении «Радар АЗС». Перед отправкой приложение автоматически скрывает найденные лица и госномера.');return}state.selectedId=s.id;"
          if old in s:
              s=s.replace(old,new,1)
          elif 'Загрузка фото доступна в приложении' not in s:
              raise SystemExit('openMedia anchor not found')
          p.write_text(s,encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          git config user.name "savka86"
          git config user.email "64674641+savka86@users.noreply.github.com"
          git add android-radar/app/src/main/java/ru/radarazs/yakutsk/MainActivity.java fuel-radar/index.html
          git commit -m "Enable privacy-processed photo uploads"
          git push
