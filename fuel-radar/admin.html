<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модерация — Радар АЗС</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}input,button{font:inherit;border-radius:9px;border:1px solid #475569;padding:9px 11px;background:#111827;color:#fff}input{min-width:320px;flex:1}button{cursor:pointer;font-weight:750}.danger{border-color:#ef4444;color:#fecaca}.ok{border-color:#22c55e;color:#bbf7d0}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:13px;margin:9px 0}.muted{color:#94a3b8;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{min-width:0}h1{font-size:22px}h2{font-size:17px;margin:18px 0 8px}.msg{white-space:pre-wrap;word-break:break-word}.badge{display:inline-block;border:1px solid #475569;border-radius:999px;padding:3px 7px;font-size:11px;margin-left:5px}.hidden{color:#fca5a5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}input{min-width:0}}</style></head><body><main class="wrap"><h1>🛡️ Модерация «Радар АЗС»</h1><div class="top"><input id="key" type="password" autocomplete="off" placeholder="Ключ администратора"><button id="load">Войти / обновить</button><button id="forget">Забыть ключ</button></div><div id="status" class="muted">Введите ключ администратора.</div><div class="grid"><section class="section"><h2>Жалобы</h2><div id="complaints"></div></section><section class="section"><h2>Свежие статусы водителей</h2><div id="reports"></div><h2>Фото и видео</h2><div id="media"></div></section></div></main><script>
const ENDPOINT='https://oetqjkmlzwemreldpbui.supabase.co/functions/v1/radar-moderate';
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
el('key').value=sessionStorage.getItem('radarAdminKey')||'';
let cache=null;
function station(id){const s=cache?.stations?.[String(id)];return s?`${s.name} — ${s.address}`:String(id||'—')}
async function api(method='GET',body=null){const key=el('key').value.trim();if(!key)throw new Error('Введите ключ администратора');sessionStorage.setItem('radarAdminKey',key);const r=await fetch(ENDPOINT,{method,headers:{'x-radar-admin':key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
async function action(action,id,reason){try{el('status').textContent='Выполняю…';await api('POST',{action,id,reason:reason||'Жалоба/проверка'});await load()}catch(e){el('status').textContent='Ошибка: '+e.message}}
function render(){const complaints=cache.complaints||[],reports=cache.reports||[],media=cache.media||[];
el('complaints').innerHTML=complaints.length?complaints.map(x=>`<article class="card"><b>#${x.id} · ${esc(x.status||'new')}</b><div class="muted">${esc(new Date(x.created_at).toLocaleString('ru-RU'))} · ${esc(station(x.related_station_id))}</div><div class="msg">${esc(x.message)}</div>${x.contact?`<div class="muted">Контакт: ${esc(x.contact)}</div>`:''}<div class="actions">${x.status==='resolved'?`<button data-a="reopen_complaint" data-id="${x.id}" class="ok">Вернуть в работу</button>`:`<button data-a="resolve_complaint" data-id="${x.id}" class="ok">Отметить решённой</button>`}</div></article>`).join(''):'<div class="muted">Жалоб пока нет.</div>';
el('reports').innerHTML=reports.length?reports.map(x=>`<article class="card ${x.hidden_at?'hidden':''}"><b>#${x.id} · ${esc(x.report_type)}</b>${x.hidden_at?'<span class="badge">СКРЫТ</span>':''}<div class="muted">${esc(station(x.station_id))} · ${esc(new Date(x.created_at).toLocaleString('ru-RU'))}</div>${x.note?`<div>${esc(x.note)}</div>`:''}<div class="actions">${x.hidden_at?`<button data-a="restore_report" data-id="${x.id}" class="ok">Вернуть</button>`:`<button data-a="hide_report" data-id="${x.id}" class="danger">Скрыть</button>`}</div></article>`).join(''):'<div class="muted">Нет свежих статусов.</div>';
el('media').innerHTML=media.length?media.map(x=>`<article class="card ${x.hidden_at?'hidden':''}"><b>${esc(x.media_type)} · ${esc(x.id)}</b>${x.hidden_at?'<span class="badge">СКРЫТО</span>':''}<div class="muted">${esc(station(x.station_id))} · ${esc(new Date(x.created_at).toLocaleString('ru-RU'))} · до ${esc(new Date(x.expires_at).toLocaleString('ru-RU'))}</div><div class="actions">${x.hidden_at?`<button data-a="restore_media" data-id="${esc(x.id)}" class="ok">Вернуть</button>`:`<button data-a="hide_media" data-id="${esc(x.id)}" class="danger">Скрыть</button>`}</div></article>`).join(''):'<div class="muted">Активных файлов нет.</div>';
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a,b.dataset.id,prompt('Причина (можно оставить пустой):','Жалоба/проверка')||'Жалоба/проверка'))}
async function load(){try{el('status').textContent='Загружаю…';cache=await api();el('status').textContent='Доступ подтверждён. Данные обновлены: '+new Date().toLocaleTimeString('ru-RU');render()}catch(e){el('status').textContent='Ошибка доступа: '+e.message;cache=null;el('complaints').innerHTML=el('reports').innerHTML=el('media').innerHTML=''}}
el('load').onclick=load;el('forget').onclick=()=>{sessionStorage.removeItem('radarAdminKey');el('key').value='';el('status').textContent='Ключ удалён из этой вкладки.'};if(el('key').value)load();
</script></body></html>
