<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Радар АЗС — Якутск</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Радар АЗС">
<link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#0c1117}body{overflow:hidden}iframe{display:block}</style>
</head>
<body>
<iframe id="radarFrame" src="./index.html?pv=6" title="Радар АЗС" allow="camera; microphone; geolocation; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script src="./pwa-photo.js?v=6"></script>
<script>
const frame=document.getElementById('radarFrame');
function enablePwaPhoto(){
  try{
    if(frame.contentWindow && frame.contentDocument){
      frame.contentWindow.RADAR_NATIVE_APP=true;
      frame.contentWindow.RADAR_PWA_APP=true;
      frame.contentWindow.RADAR_PWA_MODE=true;
    }
    if(window.RadarPwaPhoto && frame.contentWindow && frame.contentDocument){
      window.RadarPwaPhoto.install(frame);
      return !!frame.contentWindow.__RADAR_PWA_PHOTO_V5;
    }
  }catch(e){console.error('PWA photo init failed',e)}
  return false;
}
frame.addEventListener('load',enablePwaPhoto);
let tries=0;const initTimer=setInterval(()=>{tries++;if(enablePwaPhoto()||tries>=80)clearInterval(initTimer)},100);
enablePwaPhoto();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=6').catch(()=>{}))}
</script>
</body>
</html>
