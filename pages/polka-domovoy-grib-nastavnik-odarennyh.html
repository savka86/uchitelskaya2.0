<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Наставник одарённых</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      background: #f4faec;
      color: #17311a;
      font-family: Arial, sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 28px));
      margin: auto;
      padding: 28px 0 56px;
    }

    .hero,
    .card {
      padding: 28px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 16px 38px rgba(18, 63, 22, .1);
      margin-top: 20px;
    }

    .hero {
      background: linear-gradient(135deg, #103d13, #64a900);
      color: #fff;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 56px);
      margin: 10px 0;
    }

    .lead {
      font-size: 20px;
      line-height: 1.55;
      max-width: 850px;
    }

    .btn {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 999px;
      background: #fff;
      color: #123f16;
      text-decoration: none;
      font-weight: 900;
      margin-top: 10px;
    }

    .notice {
      border-left: 8px solid #64a900;
      background: #fffdf5;
      padding: 20px;
      border-radius: 18px;
      font-size: 18px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>🌟 Бесплатная полка</div>
      <h1>Наставник одарённых</h1>
      <p class="lead">Страница очищена. Все размещённые здесь материалы и ссылки на файлы удалены.</p>
      <a class="btn" href="../index.html#materials">Вернуться в бесплатную полку</a>
    </section>

    <section class="card">
      <div class="notice">
        Здесь пока нет прикреплённых файлов. При необходимости можно позже добавить новые материалы для проекта о домовом грибе.
      </div>
    </section>
  </main>
</body>
</html>
